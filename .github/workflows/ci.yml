# .github/workflows/ci.yml — Continuous Integration
#
# Runs on every push and PR to main.
# Jobs: lint → test → contract-check → docker-build
#
# Ollama is NOT available in CI — tests that need it are skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Lint with ruff
  # --------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/src/ --select=E,F,W --ignore=E501,E402,F401,W605 --exit-zero
        # exit-zero: report but don't fail (baseline has existing issues)
        # Will switch to --exit-non-zero after cleanup

  # --------------------------------------------------------------------------
  # Unit tests
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx slowapi

      - name: Run unit tests
        working-directory: tests
        run: python -m pytest unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

  # --------------------------------------------------------------------------
  # API contract check (OpenAPI schema generation)
  # --------------------------------------------------------------------------
  contract:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx slowapi

      - name: Verify OpenAPI schema generates without error
        run: |
          python -c "
          import sys; sys.path.insert(0, 'backend')
          from src.api.server import app
          schema = app.openapi()
          assert schema['info']['title'] == 'AI Trader API'
          print(f'OpenAPI schema OK: {len(schema[\"paths\"])} endpoints')
          "

  # --------------------------------------------------------------------------
  # Docker build (verify image builds, don't push)
  # --------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-trader-backend:ci .

      - name: Verify image runs
        run: |
          docker run --rm -d --name ci-test -p 8000:8000 \
            -e TRADING_MODE=READ_ONLY \
            ai-trader-backend:ci
          sleep 5
          # Health check
          curl -f http://localhost:8000/api/health || (docker logs ci-test && exit 1)
          docker stop ci-test
