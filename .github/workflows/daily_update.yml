name: Daily Data Update

on:
  schedule:
    # Run daily at 00:00 UTC (adjust for your timezone)
    # Example: 00:00 UTC = 08:00 CST (China Standard Time)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install requests
      
      - name: Run trading cycle and upload to Railway
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL || 'https://web-production-b42d6.up.railway.app' }}
        run: |
          python scripts/run_cycle_and_upload_to_railway.py
      
      - name: Check upload status
        run: |
          echo "Checking if data was uploaded successfully..."
          # Add verification step if needed

