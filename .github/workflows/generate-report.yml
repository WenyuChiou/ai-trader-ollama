name: Generate Daily Report

on:
  schedule:
    # Run daily at 00:00 UTC (after market close)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_static_report.py'
      - 'backend/data/logs/**'

permissions:
  contents: write
  pages: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
      
      - name: Generate static report
        run: |
          python scripts/generate_static_report.py --output frontend/report.html
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Commit and push report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/report.html
          git diff --staged --quiet || git commit -m "Auto-update daily report [skip ci]"
          git push
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'

