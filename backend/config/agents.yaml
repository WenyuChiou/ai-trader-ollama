# Agent Configuration
# NOTE: All agents use the unified model from config.json -> llm.default_model
# If you need a specific agent to use a different model, uncomment and set the "model" field for that agent
# Model priority: agents.yaml model field > config.json llm.default_model > "llama3.1"

market_agent:
  name: Market Data & Quotes
  # model: deepseek-r1  # Uses config.json llm.default_model if not specified
  temperature: 0.2
  prompt_file: ../prompts/market_agent.yml

