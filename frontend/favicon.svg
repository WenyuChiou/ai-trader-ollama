  <rect x="68" y="30" width="8" height="45" fill="#22d3ee"/>
  
  <!-- Upward trend arrow -->
  <path d="M 75 32 L 85 25 L 85 35 Z" fill="#10b981" stroke="#10b981" stroke-width="1"/>
  <line x1="68" y1="40" x2="82" y2="28" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- AI sparkle -->
  <circle cx="25" cy="30" r="2" fill="#22d3ee"/>
