<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Trader Portfolio Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        h1 {
            color: #22d3ee;
            margin-bottom: 10px;
            font-size: 36px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 16px;
        }
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            display: inline-block;
            padding: 16px 32px;
            background: rgba(34, 211, 238, 0.1);
            border: 2px solid #22d3ee;
            border-radius: 12px;
            color: #22d3ee;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            min-width: 200px;
        }
        a:hover {
            background: rgba(34, 211, 238, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(34, 211, 238, 0.3);
        }
        .description {
            color: #94a3b8;
            margin-top: 30px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💹 AI-Trader</h1>
        <p class="subtitle">Multi-Agent Trading System</p>
        <div class="links">
            <a href="monitor.html">📊 Live Dashboard</a>
            <a href="report.html">📈 Daily Report</a>
        </div>
        <div class="description">
            <p><strong>Live Dashboard</strong>: Real-time portfolio monitoring and trading controls</p>
            <p><strong>Daily Report</strong>: Static summary of trading results and performance</p>
        </div>
    </div>
</body>
</html>
