<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trader - 测试版监控页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(34, 211, 238, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            color: #22d3ee;
            font-weight: 700;
        }

        .header .status {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-badge.success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #22d3ee;
            color: #0f172a;
        }

        .btn-primary:hover {
            background: #06b6d4;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 211, 238, 0.4);
        }

        .section {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(34, 211, 238, 0.3);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 20px;
            color: #22d3ee;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .conversation-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .conversation-agent {
            font-size: 16px;
            font-weight: 700;
            color: #22d3ee;
        }

        .conversation-date {
            font-size: 12px;
            color: #64748b;
        }

        .conversation-content {
            font-size: 14px;
            color: #cbd5e1;
            white-space: pre-wrap;
            line-height: 1.8;
            margin-top: 12px;
        }

        /* RiskAnalyst 特殊样式 */
        .risk-report {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .risk-level {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .risk-level.high {
            color: #ef4444;
        }

        .risk-level.medium {
            color: #f59e0b;
        }

        .risk-level.low {
            color: #10b981;
        }

        .risk-details {
            margin-top: 12px;
        }

        .risk-details h4 {
            color: #f59e0b;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .risk-details ul {
            margin-left: 20px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .risk-details li {
            margin-bottom: 4px;
        }

        /* TraderAgent 特殊样式 */
        .trader-decision {
            background: rgba(34, 211, 238, 0.1);
            border-left: 4px solid #22d3ee;
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .trader-stance {
            font-size: 16px;
            font-weight: 700;
            color: #22d3ee;
            margin-bottom: 8px;
        }

        .trader-summary {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.8;
        }

        /* Discussion Rounds 特殊样式 */
        .discussion-rounds {
            margin-top: 24px;
        }

        .round-section {
            background: rgba(34, 211, 238, 0.05);
            border-left: 4px solid #22d3ee;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .round-title {
            font-size: 16px;
            font-weight: 700;
            color: #22d3ee;
            margin-bottom: 12px;
        }

        .round-content {
            margin-left: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .spinner {
            border: 3px solid rgba(34, 211, 238, 0.3);
            border-top: 3px solid #22d3ee;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 16px;
            color: #ef4444;
            text-align: center;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Trader - 测试版监控页面</h1>
            <div class="status">
                <div class="status-badge" id="apiStatus">检查中...</div>
                <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">💬 对话记录</div>
            <div id="conversationsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在加载对话数据...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        // 获取 Agent 图标
        function getAgentIcon(agentName) {
            const icons = {
                'MarketAgent': '🌐',
                'MarketAnalyst': '🌐',
                'TechnicalAnalyst': '📈',
                'FundamentalAnalyst': '💼',
                'SentimentAnalyst': '😊',
                'DiscussionCoordinator': '💬',
                'DiscussionAgent': '💬',
                'RiskAnalyst': '⚠️',
                'TraderAgent': '🤖',
                'ToolSystem': '🔧',
                'Unknown': '🤖'
            };
            
            for (const [key, icon] of Object.entries(icons)) {
                if (agentName.toLowerCase().includes(key.toLowerCase())) {
                    return icon;
                }
            }
            return icons[agentName] || '🤖';
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 检查 API 状态
        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                if (response.ok) {
                    document.getElementById('apiStatus').textContent = '✅ API 连接正常';
                    document.getElementById('apiStatus').className = 'status-badge success';
                } else {
                    throw new Error('API 响应异常');
                }
            } catch (error) {
                document.getElementById('apiStatus').textContent = '❌ API 连接失败';
                document.getElementById('apiStatus').className = 'status-badge error';
            }
        }

        // 获取对话数据
        async function fetchConversations() {
            try {
                const response = await fetch(`${API_BASE}/api/agents/conversations?limit=100&include_demo=false`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                return data.conversations || [];
            } catch (error) {
                console.error('[fetchConversations] Error:', error);
                return [];
            }
        }

        // 渲染对话
        function renderConversations(conversations) {
            const container = document.getElementById('conversationsContainer');
            
            if (conversations.length === 0) {
                container.innerHTML = '<div class="empty">暂无对话记录</div>';
                return;
            }

            // 按类型分组
            const byType = {
                discussionRounds: [],  // Round 1, 2, 3
                riskAnalyst: [],
                traderAgent: [],
                others: []
            };

            conversations.forEach(conv => {
                const agent = conv.agent || 'Unknown';
                const round = conv.round || 0;
                const type = conv.type || 'discussion';

                // 多轮讨论（Round > 0）
                if (type === 'discussion' && round > 0) {
                    byType.discussionRounds.push(conv);
                }
                // RiskAnalyst
                else if (agent === 'RiskAnalyst' || agent.toLowerCase().includes('risk')) {
                    byType.riskAnalyst.push(conv);
                }
                // TraderAgent
                else if (agent === 'TraderAgent' || agent.toLowerCase().includes('trader')) {
                    byType.traderAgent.push(conv);
                }
                // 其他
                else {
                    byType.others.push(conv);
                }
            });

            let html = '';

            // 1. 显示多轮讨论
            if (byType.discussionRounds.length > 0) {
                const rounds = {};
                byType.discussionRounds.forEach(conv => {
                    const round = conv.round || 0;
                    if (!rounds[round]) {
                        rounds[round] = [];
                    }
                    rounds[round].push(conv);
                });

                html += '<div class="discussion-rounds">';
                html += '<div class="section-title">💬 多轮讨论</div>';
                
                const sortedRounds = Object.keys(rounds).sort((a, b) => parseInt(a) - parseInt(b));
                sortedRounds.forEach(roundNum => {
                    html += `<div class="round-section">`;
                    html += `<div class="round-title">Round ${roundNum}</div>`;
                    html += `<div class="round-content">`;
                    
                    rounds[roundNum].forEach(conv => {
                        const agent = conv.agent || 'Unknown';
                        const content = conv.content || '';
                        const timestamp = conv.timestamp || conv.date || '';
                        const agentIcon = getAgentIcon(agent);
                        
                        html += `
                            <div class="conversation-item">
                                <div class="conversation-header">
                                    <span class="conversation-agent">${agentIcon} ${escapeHtml(agent)}</span>
                                    <span class="conversation-date">${timestamp ? new Date(timestamp).toLocaleString() : ''}</span>
                                </div>
                                <div class="conversation-content">${escapeHtml(content)}</div>
                            </div>
                        `;
                    });
                    
                    html += `</div></div>`;
                });
                
                html += '</div>';
            }

            // 2. 显示 RiskAnalyst
            if (byType.riskAnalyst.length > 0) {
                html += '<div class="section-title">⚠️ 风险分析报告</div>';
                
                byType.riskAnalyst.forEach(conv => {
                    const riskReport = conv.risk_report || {};
                    const riskLevel = riskReport.overall_risk_level || riskReport.risk_level || 'medium';
                    const riskScore = riskReport.risk_score || 5.0;
                    const analysis = riskReport.analysis || conv.content || '';
                    const marketRisks = riskReport.market_risks || [];
                    const recommendations = riskReport.recommendations || [];
                    const timestamp = conv.timestamp || conv.date || '';

                    const riskColorClass = 
                        riskLevel === 'high' ? 'high' :
                        riskLevel === 'medium' ? 'medium' : 'low';

                    html += `
                        <div class="conversation-item">
                            <div class="conversation-header">
                                <span class="conversation-agent">⚠️ RiskAnalyst</span>
                                <span class="conversation-date">${timestamp ? new Date(timestamp).toLocaleString() : ''}</span>
                            </div>
                            <div class="risk-report">
                                <div class="risk-level ${riskColorClass}">
                                    风险等级: ${riskLevel.toUpperCase()} (评分: ${riskScore}/10)
                                </div>
                                ${analysis ? `<div class="conversation-content">${escapeHtml(analysis)}</div>` : ''}
                                ${marketRisks.length > 0 ? `
                                    <div class="risk-details">
                                        <h4>市场风险信号:</h4>
                                        <ul>
                                            ${marketRisks.map(risk => {
                                                const riskText = typeof risk === 'string' ? risk : 
                                                    `${risk.type || 'Unknown'}: ${risk.description || risk.severity || ''}`;
                                                return `<li>${escapeHtml(riskText)}</li>`;
                                            }).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                                ${recommendations.length > 0 ? `
                                    <div class="risk-details">
                                        <h4>建议:</h4>
                                        <ul>
                                            ${recommendations.map(rec => `<li>${escapeHtml(String(rec))}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            }

            // 3. 显示 TraderAgent
            if (byType.traderAgent.length > 0) {
                html += '<div class="section-title">🤖 交易决策</div>';
                
                byType.traderAgent.forEach(conv => {
                    const decision = conv.decision || {};
                    const summary = conv.content || decision.summary || '';
                    const stance = decision.stance || conv.stance || 'NEUTRAL';
                    const timestamp = conv.timestamp || conv.date || '';
                    
                    // 只显示 summary，不显示详细订单信息
                    html += `
                        <div class="conversation-item">
                            <div class="conversation-header">
                                <span class="conversation-agent">🤖 TraderAgent</span>
                                <span class="conversation-date">${timestamp ? new Date(timestamp).toLocaleString() : ''}</span>
                            </div>
                            <div class="trader-decision">
                                <div class="trader-stance">🎯 市场立场: ${stance}</div>
                                <div class="trader-summary">${escapeHtml(summary)}</div>
                            </div>
                        </div>
                    `;
                });
            }

            // 4. 显示其他对话
            if (byType.others.length > 0) {
                html += '<div class="section-title">📋 其他对话</div>';
                
                byType.others.forEach(conv => {
                    const agent = conv.agent || 'Unknown';
                    const content = conv.content || '';
                    const timestamp = conv.timestamp || conv.date || '';
                    const agentIcon = getAgentIcon(agent);
                    
                    html += `
                        <div class="conversation-item">
                            <div class="conversation-header">
                                <span class="conversation-agent">${agentIcon} ${escapeHtml(agent)}</span>
                                <span class="conversation-date">${timestamp ? new Date(timestamp).toLocaleString() : ''}</span>
                            </div>
                            <div class="conversation-content">${escapeHtml(content)}</div>
                        </div>
                    `;
                });
            }

            container.innerHTML = html;
        }

        // 刷新数据
        async function refreshData() {
            const container = document.getElementById('conversationsContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在刷新数据...</p>
                </div>
            `;

            try {
                await checkApiStatus();
                const conversations = await fetchConversations();
                renderConversations(conversations);
            } catch (error) {
                container.innerHTML = `
                    <div class="error">
                        <h3>加载失败</h3>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="refreshData()" style="margin-top: 16px;">重试</button>
                    </div>
                `;
            }
        }

        // 页面加载时自动刷新
        window.addEventListener('load', () => {
            refreshData();
            // 每30秒自动刷新
            setInterval(refreshData, 30000);
        });
    </script>
</body>
</html>
